services:
  postgres:
    image: postgres:16-alpine
    container_name: arxivradar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: arxivradar
      POSTGRES_PASSWORD: arxivradar
      POSTGRES_DB: arxivradar
    ports:
      - "5432:5432"
    volumes:
      - arxivradar_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "arxivradar"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: arxivradar-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - arxivradar_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  arxivradar_pg_data:
  arxivradar_redis_data:
